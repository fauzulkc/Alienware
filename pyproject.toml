[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x17tune"
version = "0.1.0"
description = "Ambient-aware power/thermal auto-tuner for the Alienware x17 R2 (i7-12700H + RTX 3070 Ti)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "psutil>=5.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
nvidia = ["nvidia-ml-py>=12.535"]
windows = ["nvidia-ml-py>=12.535", "wmi>=1.5; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[project.scripts]
x17tune = "x17tune.__main__:main"

[tool.setuptools.packages.find]
where = ["tools/autotune"]

[tool.setuptools.package-data]
x17tune = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["tools/autotune", "tools/bios", "bench"]
testpaths = ["tests"]
